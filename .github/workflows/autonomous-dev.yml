name: Marschal autonomous developer

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:
    inputs:
      repo:
        description: "Optional configured target repository name"
        required: false
        type: string
      dry_run:
        description: "Generate and validate a change without pushing a branch or PR"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: marschal-autonomous-developer
  cancel-in-progress: false

jobs:
  develop:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      TARGET_REPO: ${{ inputs.repo }}
      MARSCHAL_DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: Check out Marschal
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify required secrets
        shell: bash
        run: |
          if [[ -z "$GROQ_API_KEY" ]]; then
            echo "GROQ_API_KEY is not configured" >&2
            exit 1
          fi
          if [[ -z "$GH_AGENT_TOKEN" ]]; then
            echo "GH_AGENT_TOKEN is not configured" >&2
            exit 1
          fi

      - name: Verify tools
        run: |
          python --version
          git --version
          gh --version

      - name: Run Marschal and watch PR checks
        run: python run_marschal.py
