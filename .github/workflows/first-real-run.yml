name: Marschal first real run

on:
  push:
    paths:
      - ".github/workflows/first-real-run.yml"

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
      GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      TARGET_REPO: "notification-service"
      MARSCHAL_DRY_RUN: "false"
    steps:
      - name: Check out Marschal
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secrets
        shell: bash
        run: |
          test -n "$GROQ_API_KEY"
          test -n "$GH_AGENT_TOKEN"
      - name: Configure GitHub authentication
        run: gh auth setup-git
      - name: Run Marschal and watch checks
        run: python run_marschal.py
