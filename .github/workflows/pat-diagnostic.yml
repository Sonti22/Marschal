name: Marschal PAT diagnostic

on:
  push:
    paths:
      - ".github/workflows/pat-diagnostic.yml"

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
    steps:
      - name: Check token identity
        run: gh api user --jq '.login'
      - name: Show target repository permissions
        run: gh api repos/Sonti22/notification-service --jq '.permissions'
