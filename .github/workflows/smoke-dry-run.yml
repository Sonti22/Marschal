name: Marschal one-shot dry run

on:
  push:
    paths:
      - ".github/workflows/smoke-dry-run.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_AGENT_TOKEN: ${{ secrets.GH_AGENT_TOKEN }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: "openai/gpt-oss-120b"
      TARGET_REPO: "notification-service"
      MARSCHAL_DRY_RUN: "true"
    steps:
      - name: Check out Marschal
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify secrets are present
        shell: bash
        run: |
          test -n "$GROQ_API_KEY" || { echo "GROQ_API_KEY missing"; exit 1; }
          test -n "$GH_AGENT_TOKEN" || { echo "GH_AGENT_TOKEN missing"; exit 1; }
          echo "Required secrets are present."
      - name: Run Marschal dry-run
        run: python agent.py
